site_name: HGUTHRIE
site_url: https://hguthrie.github.io
repo_name: hguthrie/hguthrie.github.io
theme:
  name: material
  palette:
    primary: deep purple
  features:
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.highlight

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
